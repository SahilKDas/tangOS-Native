[package]
name = "tangos_raster"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
png = "=0.17.16"
miniz_oxide = "=0.8.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
